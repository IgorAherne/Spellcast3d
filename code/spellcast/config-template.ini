; Spellcast3D settings. A line starting with ; is switched off.
; Change a line, save, then close Spellcast3D and start it again: it installs what the new choice needs
; (and keeps the old one, so switching back is instant).
[image generator]
; Keep ONE backend line switched on.
backend = qwen      ; Qwen-Image 2.1, built in (default). Research licence for the model; the pictures you make are yours, also for commercial work. (FLUX.3 Klein, its optional third model, has its own licence: README - LICENSE.txt.)
; backend = forge   ; Forge Neo WebUI with your own Stable Diffusion models (bring a checkpoint into models\checkpoints).
; Model size (bigger = a little better, needs more video memory and download), the same for all three models of the
; Images page: the Turbo (the default), the full Qwen-Image 2.1 and FLUX.3 Klein (those two are downloaded only when
; you ask for them there). A bigger size already in the models folder is used instead of downloading this one.
; Q3_K_M (3.2 GB, 6 GB cards) | Q4_K_M (4.2 GB, default) | Q5_K_M (5.4 GB) | Q6_K (6.3 GB) | Q8_0 (7.6 GB, 16 GB+ cards)
; (Qwen-Image's sizes; FLUX.3 Klein's files for them: 3.3 | 3.9 | 4.5 | 4.8 | 6.1 GB, plus 2.8 GB it needs with any.)
quality = Q4_K_M
; The text encoder (Qwen3-VL-8B): it reads your words and example pictures for the Images models, once a picture.
; Bigger = a little more faithful to long or subtle descriptions; more RAM and download, a few seconds more a new
; description, the drawing itself as fast. The same rule: a bigger one already in the models folder is used instead.
; UD-Q4_K_XL (5.1 GB, default) | UD-Q5_K_XL (5.9 GB) | UD-Q6_K_XL (7.5 GB) | Q8_0 (8.7 GB) | UD-Q8_K_XL (10.8 GB)
text_encoder = UD-Q4_K_XL
[profiling]
; For developers: measures every picture Qwen-Image 2.1 makes, to find what makes it slow. Switch ONE on, save, then
; close Spellcast3D and start it again: Qwen-Image then starts with that profiler attached (the first time, it installs
; it: pyinstrument, or PyTorch, 3.5 GB unless another tool here has it). Reports go to code\logs\profiling\.
; Switched off again, the next picture is not measured.
use_python_profiler = off            ; the launcher's own Python code: which functions take the time (pyinstrument)
use_torch_profiler = off             ; the GPU: every CUDA kernel, per phase and per step, the slowest first (torch.profiler)
diagnostic_enable_sync_hunter = off  ; where the CPU waits for the GPU, and where the GPU sits idle between kernels
